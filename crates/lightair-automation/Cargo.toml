[package]
name = "lightair-automation"
description = "Lightair's automations: triggers, conditions and steps run on the event bus (Streamer.bot's place, built in)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lightair-live.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
getrandom = "0.3"
# Streamer.bot import (streamerbot.rs)
base64 = "0.22"
flate2 = "1"
# The same TLS as lightair-live (rustls, the system's verifier): lightair_live::net::tls_config.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
