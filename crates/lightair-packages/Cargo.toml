[package]
name = "lightair-packages"
description = "Lightair packages: the manifest and its checks, reading package folders and .airpkg files, the installed store, a project's packages.json and lock file, and import and export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
ed25519-dalek = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
