[package]
name = "lightair-check"
description = "The static checks a Lightair package passes before a catalog lists it, and the checker's command line the check workflows call"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lightair-check"
path = "src/main.rs"

[dependencies]
lightair-packages = { path = "../lightair-packages" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
regex = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
goblin = "0.10"
spdx = "0.13"
