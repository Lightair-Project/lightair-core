<!doctype html>
<html><head><meta charset="utf-8"><title>Alert box</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--font); }
  #alert { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; opacity: 0; max-width: 92%; }
  #alert.left { flex-direction: row; text-align: left; gap: 24px; }
  #alert.show { animation: var(--in) .6s cubic-bezier(.2,.9,.3,1.2) forwards; }
  #alert.hide { animation: out .5s ease-in forwards; }
  #media img, #media video { max-width: var(--img); max-height: var(--img); display: block; }
  #badge { width: calc(var(--size) * 2.2); height: calc(var(--size) * 2.2); border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: calc(var(--size) * 1.1); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #title { font-size: var(--size); font-weight: 800; color: var(--text); text-shadow: 0 3px 12px rgba(0,0,0,.6); line-height: 1.15; }
  #title b { color: var(--accent); }
  #message { font-size: var(--msg); color: var(--text); text-shadow: 0 2px 8px rgba(0,0,0,.6); max-width: 900px; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(60px) } to { opacity: 1; transform: none } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes none { to { opacity: 1 } }
  @keyframes out { from { opacity: 1 } to { opacity: 0; transform: scale(.96) } }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="alert"><div id="media"></div><div><div id="title"></div><div id="message"></div></div></div>
<audio id="sound"></audio>
<script>
  var BADGES = { follow: '❤️', sub: '⭐', paid: '💸', cheer: '💎', raid: '🚀' };
  var box = document.getElementById('alert');
  function style(f) {
    var r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 44) + 'px');
    r.setProperty('--msg', (f.messageSize || 26) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--accent', f.accentColor || '#F5A623');
    r.setProperty('--img', (f.imageSize || 300) + 'px');
    r.setProperty('--in', f.animation || 'pop');
    box.className = f.layout === 'left' ? 'left' : '';
  }
  lightair.on('load', function () { style(lightair.fields); });
  lightair.on('fields', style);
  var ending = null;
  function end() {
    if (!ending) return;
    clearTimeout(ending); ending = null;
    box.classList.remove('show'); box.classList.add('hide');
    var a = document.getElementById('sound'); a.pause();
    setTimeout(function () { box.classList.remove('hide'); box.style.opacity = 0; lightair.done(); }, 550);
  }
  lightair.on('skip', end);
  // automations' sounds
  lightair.on('sound', function (m) {
    var a = new Audio(lightair.file(m.file)); a.volume = Math.min(1, (+m.volume || 100) / 100); a.play().catch(function () {});
  });
  lightair.on('alert', function (e) {
    var f = lightair.fields, k = lightair.kindOf(e);
    if (!f[k + 'Enabled'] || (k === 'paid' && e.paid && e.paid.amount < (+f.paidMin || 0)) || (k === 'cheer' && e.paid && e.paid.amount < (+f.cheerMin || 0))) {
      return lightair.done();
    }
    var who = lightair.escape(lightair.format('{name}', e));
    var text = lightair.escape(lightair.format(f[k + 'Text'] || '{name}', e));
    if (who) text = text.replace(who, '<b>' + who + '</b>');
    document.getElementById('title').innerHTML = text;
    document.getElementById('message').innerHTML = f.showMessage && e.text ? lightair.render(e) : '';
    var media = document.getElementById('media'), img = f[k + 'Image'];
    if (img && /\.(mp4|webm|mov)$/i.test(img)) media.innerHTML = '<video autoplay muted playsinline src="' + lightair.file(img) + '"></video>';
    else if (img) media.innerHTML = '<img src="' + lightair.file(img) + '">';
    else media.innerHTML = '<div id="badge">' + (BADGES[k] || '✨') + '</div>';
    var snd = f[k + 'Sound'], audio = document.getElementById('sound');
    if (snd) { audio.src = lightair.file(snd); audio.volume = Math.min(1, (+f.volume || 0) / 100); audio.play().catch(function () {}); }
    if (f.speak && e.text && (k === 'paid' || k === 'cheer')) lightair.speak(e.text);
    box.classList.remove('hide'); void box.offsetWidth; box.classList.add('show');
    ending = setTimeout(end, Math.max(1, +f.duration || 8) * 1000);
  });
</script>
</body></html>
