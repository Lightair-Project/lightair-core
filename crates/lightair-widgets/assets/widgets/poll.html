<!doctype html>
<html><head><meta charset="utf-8"><title>Poll</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); padding: 12px; box-sizing: border-box; }
  #box { background: var(--bg); border-radius: 12px; padding: .7em .9em; }
  #q { font-weight: 800; margin-bottom: .5em; }
  .o { position: relative; margin: .3em 0; padding: .3em .6em; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar { position: absolute; inset: 0; width: 0; background: var(--accent); opacity: .45; transition: width .5s; }
  .l { position: relative; display: flex; justify-content: space-between; gap: 1em; }
  #foot { font-size: .7em; opacity: .75; margin-top: .4em; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="box"><div id="q"></div><div id="opts"></div><div id="foot"></div></div>
<script>
  // votes: who → option (one each); kept so a reload doesn't lose them
  var votes = {}, open = false, until = 0;
  function options() { return String(lightair.fields.options || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean); }
  function draw() {
    var f = lightair.fields, r = document.documentElement.style, opts = options(), counts = opts.map(function () { return 0; }), total = 0;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 24) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.5)');
    r.setProperty('--accent', f.accentColor || '#8B5CF6');
    Object.keys(votes).forEach(function (k) { if (votes[k] < counts.length) { counts[votes[k]]++; total++; } });
    document.getElementById('q').textContent = f.question || '';
    document.getElementById('opts').innerHTML = opts.map(function (o, i) {
      var pct = total ? Math.round(counts[i] * 100 / total) : 0;
      return '<div class="o"><div class="bar" style="width:' + pct + '%"></div><div class="l"><span>' + (i + 1) + '. ' + lightair.escape(o) + '</span><span>' + pct + '% (' + counts[i] + ')</span></div></div>';
    }).join('');
    var left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    document.getElementById('foot').textContent = open ? 'Type a number in chat to vote · ' + (left ? left + ' s' : '') : (total ? 'Poll closed · ' + total + ' votes' : 'Not started');
  }
  function save() { lightair.store('poll', { votes: votes, open: open, until: until }); }
  lightair.on('load', function () {
    var p = lightair.storage.poll; if (p) { votes = p.votes || {}; open = p.open; until = p.until || 0; }
    draw(); setInterval(function () { if (open && until && Date.now() > until) { open = false; save(); } draw(); }, 1000);
  });
  lightair.on('fields', draw);
  lightair.on('button', function (b) {
    if (b === 'start') { votes = {}; open = true; until = (+lightair.fields.seconds || 0) > 0 ? Date.now() + lightair.fields.seconds * 1000 : 0; }
    if (b === 'stop') open = false;
    save(); draw();
  });
  lightair.on('event', function (e) {
    if (!open || lightair.kindOf(e) !== 'message' || !e.user) return;
    var m = /^\s*!?(?:vote\s*)?(\d+)\s*$/i.exec(e.text || '');
    if (!m) return;
    var n = +m[1] - 1;
    if (n < 0 || n >= options().length) return;
    votes[e.platform + ':' + e.user.id] = n;
    save(); draw();
  });
</script>
</body></html>
