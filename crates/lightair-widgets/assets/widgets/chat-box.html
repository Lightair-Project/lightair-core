<!doctype html>
<html><head><meta charset="utf-8"><title>Chat box</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); font-size: var(--size); color: var(--text); }
  #list { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: var(--gap); padding: 12px; }
  body.top #list { top: 0; bottom: auto; }
  .m { background: var(--bg); border-radius: var(--radius); padding: .35em .6em; line-height: 1.35; word-wrap: break-word; animation: var(--in) .35s ease-out; text-shadow: var(--shadow); }
  .m.gone { transition: opacity .6s; opacity: 0; }
  .m.paid { background: var(--paidbg); border: 2px solid var(--accent); }
  .m.notice { border-left: 4px solid var(--accent); }
  .who { font-weight: 700; margin-right: .35em; }
  .icon { height: 1em; width: 1em; vertical-align: -0.12em; margin-right: .3em; border-radius: 3px; }
  .role { font-size: .62em; font-weight: 800; padding: .1em .35em; border-radius: .3em; margin-right: .35em; vertical-align: .15em; color: #fff; }
  .amount { color: var(--accent); font-weight: 800; margin-right: .35em; }
  .head { font-weight: 700; }
  @keyframes slide { from { opacity: 0; transform: translateX(-24px) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes none { to { opacity: 1 } }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="list"></div>
<script>
  var list = document.getElementById('list');
  var ROLES = { broadcaster: ['HOST', '#E5484D'], moderator: ['MOD', '#30A46C'], vip: ['VIP', '#D6409F'], subscriber: ['SUB', '#8E4EC6'], member: ['MEMBER', '#8E4EC6'] };
  function style(f) {
    var r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 22) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.45)');
    r.setProperty('--paidbg', f.paidBackground || 'rgba(245,166,35,0.25)');
    r.setProperty('--accent', f.accentColor || '#F5A623');
    r.setProperty('--radius', (f.rounded ? 10 : 0) + 'px');
    r.setProperty('--gap', (f.spacing || 6) + 'px');
    r.setProperty('--in', f.animation || 'slide');
    r.setProperty('--shadow', f.shadow ? '0 1px 3px rgba(0,0,0,.8)' : 'none');
    document.body.className = f.align === 'top' ? 'top' : '';
  }
  function hidden(e) {
    var f = lightair.fields;
    if (f.hideCommands && /^!/.test(e.text || '')) return true;
    var bots = String(f.hideUsers || '').toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var who = e.user ? (e.user.login || e.user.display_name || '').toLowerCase() : '';
    return bots.indexOf(who) >= 0;
  }
  function add(e) {
    var f = lightair.fields, k = lightair.kindOf(e);
    var t = e.kind && e.kind.type;
    if (t === 'deletion') {
      Array.prototype.forEach.call(list.children, function (el) {
        if ((e.kind.native_id && el.dataset.id === e.kind.native_id) || (e.kind.user_id && el.dataset.user === e.kind.user_id)) el.remove();
      });
      return;
    }
    if (k !== 'message' && !(f.showEvents && (k === 'paid' || k === 'cheer' || k === 'sub' || k === 'raid' || k === 'follow'))) return;
    if (e.deleted || hidden(e)) return;
    var el = document.createElement('div');
    el.className = 'm' + (k === 'paid' || k === 'cheer' ? ' paid' : k !== 'message' ? ' notice' : '');
    el.dataset.id = e.native_id || '';
    el.dataset.user = e.user ? e.user.id : '';
    var html = '';
    if (f.showPlatform) html += '<img class="icon" src="' + lightair.icon(e.platform) + '">';
    if (f.showRoles && e.user) (e.user.roles || []).forEach(function (r) { var x = ROLES[r]; if (x) html += '<span class="role" style="background:' + x[1] + '">' + x[0] + '</span>'; });
    var colour = (e.user && e.user.color) || f.nameColor || '#9ad1ff';
    if (k === 'message') {
      html += '<span class="who" style="color:' + lightair.escape(colour) + '">' + lightair.escape(e.user ? e.user.display_name : '') + '</span>' + lightair.render(e);
    } else {
      if (e.paid) html += '<span class="amount">' + lightair.escape(e.paid.display) + '</span>';
      var line = k === 'raid' ? lightair.format('{name} is raiding with {viewers} viewers', e) : k === 'follow' ? lightair.format('{name} followed', e) : (e.headline || lightair.format('{name}', e));
      html += '<span class="head">' + lightair.escape(line) + '</span>';
      if (e.text) html += '<div>' + lightair.render(e) + '</div>';
    }
    el.innerHTML = html;
    list.appendChild(el);
    while (list.children.length > Math.max(1, +f.maxMessages || 30)) list.firstChild.remove();
    var after = +f.hideAfter || 0;
    if (after > 0) setTimeout(function () { el.classList.add('gone'); setTimeout(function () { el.remove(); }, 700); }, after * 1000);
  }
  lightair.on('load', function () {
    style(lightair.fields);
    if (!(+lightair.fields.hideAfter > 0)) lightair.recents.slice(-(+lightair.fields.maxMessages || 30)).forEach(add);
  });
  lightair.on('fields', function (f) { style(f); });
  lightair.on('event', add);
</script>
</body></html>
