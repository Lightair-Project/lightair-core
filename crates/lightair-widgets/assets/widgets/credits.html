<!doctype html>
<html><head><meta charset="utf-8"><title>Credits</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #roll { position: absolute; left: 0; right: 0; top: 100%; }
  h1 { font-size: calc(var(--size) * 1.6); margin: 0 0 1.2em; }
  h2 { font-size: calc(var(--size) * 1.1); color: var(--accent); margin: 1.6em 0 .5em; text-transform: uppercase; letter-spacing: .1em; }
  .n { font-size: var(--size); line-height: 1.6; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="roll"></div>
<script>
  var people = { follow: [], sub: [], paid: [], cheer: [], raid: [] };
  function add(e) {
    var k = lightair.kindOf(e);
    if (!people[k] || (e.test && !lightair.fields.tests)) return;
    var n = e.user ? e.user.display_name : '';
    if (n && people[k].indexOf(n) < 0) people[k].push(n);
  }
  function roll() {
    var f = lightair.fields, r = document.documentElement.style, el = document.getElementById('roll');
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 30) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--accent', f.accentColor || '#F5A623');
    var html = '<h1>' + lightair.escape(f.title || 'Thanks for watching') + '</h1>';
    [['sub', f.subsTitle], ['paid', f.paidTitle], ['cheer', f.cheerTitle], ['raid', f.raidTitle], ['follow', f.followTitle]].forEach(function (s) {
      if (people[s[0]].length && s[1]) html += '<h2>' + lightair.escape(s[1]) + '</h2>' + people[s[0]].map(function (n) { return '<div class="n">' + lightair.escape(n) + '</div>'; }).join('');
    });
    el.innerHTML = html;
    el.getAnimations().forEach(function (a) { a.cancel(); });
    var height = el.offsetHeight + window.innerHeight;
    el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-' + height + 'px)' }], { duration: height / (+f.speed || 60) * 1000, iterations: f.loop ? Infinity : 1 });
  }
  lightair.on('load', function () { lightair.recents.forEach(add); roll(); });
  lightair.on('event', add);
  lightair.on('fields', roll);
  lightair.on('button', function (b) { if (b === 'restart') roll(); });
</script>
</body></html>
