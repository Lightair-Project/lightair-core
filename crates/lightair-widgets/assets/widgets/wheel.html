<!doctype html>
<html><head><meta charset="utf-8"><title>Wheel</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); color: var(--text); }
  #wrap { position: relative; }
  #pin { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--text); z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  #result { margin-top: 14px; font-size: calc(var(--size) * 1.3); font-weight: 800; min-height: 1.4em; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
</style>
<script src="/lightair.js"></script>
</head><body><div id="wrap"><div id="pin"></div><canvas id="c"></canvas></div><div id="result"></div>
<script>
  var angle = 0, spinning = false;
  var COLOURS = ['#FF4A3B', '#FFB020', '#2BD67B', '#3B82F6', '#8B5CF6', '#F472B6', '#14B8A6', '#F97316'];
  function entries() {
    var f = lightair.fields, list = String(f.entries || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (f.fromGiveaway && lightair.data.giveaway && lightair.data.giveaway.length) list = lightair.data.giveaway;
    return list.length ? list : ['?'];
  }
  function draw() {
    var f = lightair.fields, c = document.getElementById('c'), size = Math.min(window.innerWidth, window.innerHeight - 80);
    var r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 22) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    c.width = c.height = size * 2; c.style.width = c.style.height = size + 'px';
    var g = c.getContext('2d'), list = entries(), n = list.length, rad = size - 8, step = Math.PI * 2 / n;
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, size, size); g.translate(size / 2, size / 2); g.rotate(angle);
    for (var i = 0; i < n; i++) {
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, rad / 2, i * step, (i + 1) * step); g.closePath();
      g.fillStyle = COLOURS[i % COLOURS.length]; g.fill();
      g.save(); g.rotate(i * step + step / 2); g.textAlign = 'right'; g.fillStyle = '#fff';
      g.font = '700 ' + Math.max(10, Math.min(+f.fontSize || 22, rad / 2 * step * 0.55)) + 'px ' + (f.font || 'sans-serif');
      g.fillText(String(list[i]).slice(0, 18), rad / 2 - 14, 6); g.restore();
    }
  }
  function spin() {
    if (spinning) return;
    spinning = true; document.getElementById('result').textContent = '';
    var list = entries(), start = angle, turns = 5 + Math.random() * 3, total = turns * Math.PI * 2, t0 = performance.now(), dur = (+lightair.fields.seconds || 6) * 1000;
    (function frame(now) {
      var p = Math.min(1, (now - t0) / dur), ease = 1 - Math.pow(1 - p, 4);
      angle = start + total * ease; draw();
      if (p < 1) return requestAnimationFrame(frame);
      spinning = false;
      // the pin is at the top (−90°)
      var step = Math.PI * 2 / list.length, at = ((-Math.PI / 2 - angle) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
      var winner = list[Math.floor(at / step) % list.length];
      document.getElementById('result').textContent = (lightair.fields.winnerText || '{winner}!').replace('{winner}', winner);
      lightair.store('winner', winner);
    })(t0);
  }
  lightair.on('load', draw).on('fields', draw).on('data', draw);
  lightair.on('button', function (b) { if (b === 'spin') spin(); });
  window.addEventListener('resize', draw);
</script>
</body></html>
