<!doctype html>
<html><head><meta charset="utf-8"><title>Scoreboard</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); display: flex; align-items: center; justify-content: center; }
  #board { display: flex; align-items: stretch; background: var(--bg); border-radius: calc(var(--size) * .3); overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .team { display: flex; align-items: center; gap: calc(var(--size) * .4); padding: calc(var(--size) * .25) calc(var(--size) * .5); }
  .name { font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: calc(var(--size) * .6); }
  .swatch { width: calc(var(--size) * .2); align-self: stretch; }
  .score { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: center; }
  .score.bump { animation: bump .4s ease-out; }
  @keyframes bump { 40% { transform: scale(1.3) } }
  #mid { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 calc(var(--size) * .4); background: rgba(255,255,255,.06); font-size: calc(var(--size) * .45); font-variant-numeric: tabular-nums; }
  #clock { font-weight: 800; font-size: calc(var(--size) * .6); }
  #clock.out { color: #ff5a5f; }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="board">
  <div class="swatch" id="hs"></div>
  <div class="team"><span class="name" id="hn"></span><span class="score" id="h"></span></div>
  <div id="mid"><span id="period"></span><span id="clock"></span></div>
  <div class="team"><span class="score" id="a"></span><span class="name" id="an"></span></div>
  <div class="swatch" id="as"></div>
</div>
<script>
  var last = {};
  function mmss(ms) { var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function clockMs() {
    var st = lightair.storage || {}, f = lightair.fields, len = (Number(f.clockMinutes) || 0) * 60000;
    var run = st.clockRunning && st.clockSince ? Date.now() - st.clockSince : 0;
    var used = (st.clockUsed || 0) + run;
    return len > 0 ? len - used : used;
  }
  function draw() {
    var f = lightair.fields, st = lightair.storage || {}, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 40) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(10,12,16,0.85)');
    document.getElementById('hn').textContent = f.homeName || '';
    document.getElementById('an').textContent = f.awayName || '';
    document.getElementById('hs').style.background = f.homeColor || '#2F6FEB';
    document.getElementById('as').style.background = f.awayColor || '#E5484D';
    [['h', st.home || 0], ['a', st.away || 0]].forEach(function (p) {
      var el = document.getElementById(p[0]); el.textContent = p[1];
      if (last[p[0]] !== undefined && last[p[0]] !== p[1]) { el.className = 'score'; void el.offsetWidth; el.className = 'score bump'; }
      last[p[0]] = p[1];
    });
    document.getElementById('period').textContent = (f.periodLabel || 'Round') + ' ' + (st.period || 1);
    tick();
  }
  function tick() {
    var f = lightair.fields, c = document.getElementById('clock');
    if (!f.showClock) { c.textContent = ''; return; }
    var ms = clockMs(), len = (Number(f.clockMinutes) || 0) * 60000;
    c.textContent = mmss(ms);
    c.className = len > 0 && ms <= 0 ? 'out' : '';
  }
  lightair.on('load', draw).on('fields', draw).on('storage', draw);
  setInterval(tick, 250);
</script>
</body></html>
