<!doctype html>
<html><head><meta charset="utf-8"><title>Subathon timer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  #title { font-size: calc(var(--size) * .4); font-weight: 700; opacity: .9; }
  #time { font-size: var(--size); font-weight: 800; font-variant-numeric: tabular-nums; }
  #added { font-size: calc(var(--size) * .35); color: var(--accent); font-weight: 800; height: 1.3em; transition: opacity .5s; }
  body.paused #time { opacity: .55; }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="title"></div><div id="time">0:00:00</div><div id="added"></div>
<script>
  var shownAdded = null;
  function remaining() {
    var s = lightair.storage || {};
    if (s.running && s.endAt) return Math.max(0, s.endAt - Date.now());
    if (s.remaining != null) return s.remaining;
    return (+lightair.fields.startMinutes || 60) * 60000;
  }
  function fmt(ms) {
    var t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function style() {
    var f = lightair.fields, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 96) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--accent', f.accentColor || '#2BD67B');
    document.getElementById('title').textContent = f.title || '';
  }
  function tick() {
    document.getElementById('time').textContent = fmt(remaining());
    document.body.className = (lightair.storage || {}).running ? '' : 'paused';
  }
  lightair.on('load', function () { style(); tick(); setInterval(tick, 250); });
  lightair.on('fields', function () { style(); tick(); });
  lightair.on('storage', function (s) {
    var a = document.getElementById('added');
    if (s.lastAdded && s.lastAdded.at !== shownAdded) {
      shownAdded = s.lastAdded.at;
      a.style.opacity = 1;
      a.textContent = '+' + fmt(s.lastAdded.ms).replace(/^0:/, '') + ' ' + (s.lastAdded.from || '');
      setTimeout(function () { a.style.opacity = 0; }, 4000);
    }
    tick();
  });
</script>
</body></html>
