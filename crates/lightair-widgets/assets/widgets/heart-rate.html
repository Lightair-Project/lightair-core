<!doctype html>
<html><head><meta charset="utf-8"><title>Heart rate</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); display: flex; align-items: center; justify-content: center; gap: .3em; font-size: var(--size); font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #heart { color: var(--accent); display: inline-block; animation: beat var(--period) ease-in-out infinite; }
  #unit { font-size: .45em; opacity: .8; align-self: flex-end; margin-bottom: .3em; }
  @keyframes beat { 0%, 100% { transform: scale(1) } 15% { transform: scale(1.25) } 30% { transform: scale(1) } }
</style>
<script src="/lightair.js"></script>
</head><body><span id="heart">❤</span><span id="bpm">--</span><span id="unit">BPM</span>
<script>
  function draw() {
    var f = lightair.fields, r = document.documentElement.style, bpm = (lightair.data || {}).heart_rate;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 64) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--accent', f.accentColor || '#FF3B5C');
    r.setProperty('--period', bpm ? (60 / bpm).toFixed(2) + 's' : '1s');
    document.getElementById('bpm').textContent = bpm || '--';
    document.getElementById('unit').textContent = f.unit || 'BPM';
  }
  lightair.on('load', draw).on('fields', draw).on('data', function (d) { if (d.key === 'heart_rate') draw(); });
</script>
</body></html>
