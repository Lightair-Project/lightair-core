<!doctype html>
<html><head><meta charset="utf-8"><title>Emote combo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); display: flex; align-items: center; justify-content: center; }
  #combo { display: flex; align-items: center; gap: .3em; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s; }
  #combo.on { opacity: 1; transform: scale(1); }
  #combo.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.18) } }
  #emote { height: var(--emote); filter: drop-shadow(0 0 14px var(--accent)); }
  #count { color: var(--text); font-weight: 900; font-size: calc(var(--emote) * .55); text-shadow: 0 0 18px var(--accent), 0 3px 0 rgba(0,0,0,.4); }
  #word { display: block; font-size: .4em; letter-spacing: .12em; opacity: .85; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="combo"><img id="emote"><div id="count"></div></div>
<script>
  // the same emote in several messages close together: a combo, counted while it lasts
  var recent = {}, current = null, hide = null;
  function look() {
    var f = lightair.fields, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--emote', (+f.size || 96) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--accent', f.accentColor || '#FF3B4A');
  }
  function draw(code, image, n) {
    var box = document.getElementById('combo');
    document.getElementById('emote').src = image;
    document.getElementById('count').innerHTML = '×' + n + '<span id="word">COMBO</span>';
    box.classList.add('on'); box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
    clearTimeout(hide);
    hide = setTimeout(function () { box.classList.remove('on'); current = null; }, (+lightair.fields.window || 8) * 1000);
  }
  lightair.on('load', look);
  lightair.on('fields', look);
  lightair.on('event', function (e) {
    if (lightair.kindOf(e) !== 'message' || !e.fragments) return;
    var f = lightair.fields, now = Date.now(), win = (+f.window || 8) * 1000, min = +f.minimum || 3, who = e.platform + ':' + (e.user ? e.user.id : '');
    var seen = {};
    e.fragments.forEach(function (x) {
      if (x.type !== 'emote' || seen[x.code]) return;
      seen[x.code] = true;
      var r = recent[x.code] = recent[x.code] || { image: x.image, hits: [] };
      r.image = x.image;
      // one per person per message, within the window
      r.hits = r.hits.filter(function (h) { return now - h.at < win; });
      r.hits.push({ at: now, who: who });
      var n = r.hits.length;
      if (n >= min && (!current || current === x.code || n > (recent[current] ? recent[current].hits.length : 0))) {
        current = x.code;
        draw(x.code, r.image, n);
      }
    });
  });
</script>
</body></html>
