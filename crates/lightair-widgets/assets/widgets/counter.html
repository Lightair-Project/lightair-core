<!doctype html>
<html><head><meta charset="utf-8"><title>Counter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); font-weight: 800; display: flex; align-items: center; justify-content: var(--align); padding: 0 10px; box-sizing: border-box; white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #v { display: inline-block; }
  #v.bump { animation: bump .35s ease-out; }
  @keyframes bump { 40% { transform: scale(1.25) } }
</style>
<script src="/lightair.js"></script>
</head><body><span id="t"></span>
<script>
  var last = null;
  function draw() {
    var f = lightair.fields, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 48) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--align', { left: 'flex-start', center: 'center', right: 'flex-end' }[f.align] || 'center');
    var v = (lightair.storage || {}).value || 0;
    var parts = String(f.template || '{title}: {value}').replace('{title}', f.title || '').split('{value}');
    var el = document.getElementById('t');
    el.textContent = '';
    parts.forEach(function (p, i) {
      el.appendChild(document.createTextNode(p));
      if (i < parts.length - 1) { var s = document.createElement('span'); s.id = 'v'; s.textContent = v; el.appendChild(s); }
    });
    if (last !== null && last !== v) { var s = document.getElementById('v'); if (s) s.className = 'bump'; }
    last = v;
  }
  lightair.on('load', draw).on('fields', draw).on('storage', draw);
</script>
</body></html>
