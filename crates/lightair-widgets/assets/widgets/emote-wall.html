<!doctype html>
<html><head><meta charset="utf-8"><title>Emote wall</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .e { position: absolute; bottom: -120px; will-change: transform, opacity; }
  @keyframes up { from { transform: translateY(0) rotate(0) scale(var(--s)); opacity: 1 } 80% { opacity: 1 } to { transform: translateY(calc(-100vh - 160px)) rotate(var(--r)) scale(var(--s)); opacity: 0 } }
</style>
<script src="/lightair.js"></script>
</head><body>
<script>
  var shown = 0;
  lightair.on('event', function (e) {
    var f = lightair.fields;
    if (lightair.kindOf(e) !== 'message') return;
    var emotes = (e.fragments || []).filter(function (x) { return x.type === 'emote'; }).slice(0, +f.perMessage || 5);
    emotes.forEach(function (x, i) {
      if (shown >= (+f.maxOnScreen || 60)) return;
      var img = document.createElement('img');
      img.className = 'e';
      img.src = x.image;
      img.style.height = (+f.size || 72) + 'px';
      img.style.left = (Math.random() * 92) + 'vw';
      img.style.setProperty('--s', (0.7 + Math.random() * 0.6).toFixed(2));
      img.style.setProperty('--r', ((Math.random() - 0.5) * 60).toFixed(0) + 'deg');
      var secs = (+f.seconds || 6) * (0.8 + Math.random() * 0.4);
      img.style.animation = 'up ' + secs + 's ease-in ' + (i * 0.15) + 's forwards';
      document.body.appendChild(img);
      shown++;
      setTimeout(function () { img.remove(); shown--; }, (secs + i * 0.15) * 1000 + 100);
    });
  });
</script>
</body></html>
