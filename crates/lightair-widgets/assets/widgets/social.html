<!doctype html>
<html><head><meta charset="utf-8"><title>Social rotator</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); display: flex; align-items: center; justify-content: var(--align); padding: 0 12px; box-sizing: border-box; }
  #s { display: flex; align-items: center; gap: .5em; font-size: var(--size); font-weight: 700; background: var(--bg); padding: .3em .7em; border-radius: .5em; transition: opacity .5s, transform .5s; }
  #s.out { opacity: 0; transform: translateY(12px); }
  #s img { height: 1.1em; width: 1.1em; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="s" class="out"></div>
<script>
  var i = 0, timer = null;
  function list() {
    return String(lightair.fields.handles || '').split(/[\n,]/).map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var m = /^(\w[\w-]*)\s*[:\s]\s*(.+)$/.exec(l);
      return m ? { p: m[1].toLowerCase(), h: m[2] } : { p: '', h: l };
    });
  }
  function show() {
    var f = lightair.fields, r = document.documentElement.style, items = list(), el = document.getElementById('s');
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 28) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.45)');
    r.setProperty('--align', { left: 'flex-start', center: 'center', right: 'flex-end' }[f.align] || 'flex-start');
    if (!items.length) return;
    el.className = 'out';
    setTimeout(function () {
      var it = items[i++ % items.length];
      el.innerHTML = (it.p ? '<img src="' + lightair.icon(it.p) + '" onerror="this.remove()">' : '') + lightair.escape(it.h);
      el.className = '';
    }, 500);
  }
  function start() { clearInterval(timer); show(); timer = setInterval(show, Math.max(2, +lightair.fields.seconds || 6) * 1000); }
  lightair.on('load', start).on('fields', start);
</script>
</body></html>
