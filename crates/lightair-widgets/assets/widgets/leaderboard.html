<!doctype html>
<html><head><meta charset="utf-8"><title>Leaderboard</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); padding: 12px; box-sizing: border-box; }
  #box { background: var(--bg); border-radius: 12px; padding: .6em .9em; }
  h3 { margin: 0 0 .4em; font-size: 1.05em; color: var(--accent); }
  .r { display: flex; gap: .6em; padding: .15em 0; }
  .n { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .i { width: 1.6em; opacity: .7; }
  .p { font-weight: 800; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="box"><h3 id="t"></h3><div id="rows"></div></div>
<script>
  function draw() {
    var f = lightair.fields, r = document.documentElement.style, list = (lightair.data.leaderboard || []).slice(0, +f.count || 5);
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 22) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.5)');
    r.setProperty('--accent', f.accentColor || '#F5A623');
    document.getElementById('t').textContent = f.title || '';
    document.getElementById('rows').innerHTML = list.length ? list.map(function (v, i) {
      return '<div class="r"><span class="i">' + (i + 1) + '.</span><span class="n">' + lightair.escape(v.name) + '</span><span class="p">' + Math.round(v.points) + '</span></div>';
    }).join('') : '<div class="r">No one yet</div>';
  }
  lightair.on('load', draw).on('fields', draw).on('data', function (d) { if (d.key === 'leaderboard') draw(); });
</script>
</body></html>
