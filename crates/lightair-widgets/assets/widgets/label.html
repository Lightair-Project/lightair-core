<!doctype html>
<html><head><meta charset="utf-8"><title>Label</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); font-weight: var(--weight); display: flex; align-items: center; justify-content: var(--align); padding: 0 8px; box-sizing: border-box; white-space: nowrap; text-shadow: var(--shadow); }
</style>
<script src="/lightair.js"></script>
</head><body><span id="t"></span>
<script>
  function draw() {
    var f = lightair.fields, s = lightair.session || {}, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 28) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--weight', f.bold ? 700 : 400);
    r.setProperty('--align', { left: 'flex-start', center: 'center', right: 'flex-end' }[f.align] || 'flex-start');
    r.setProperty('--shadow', f.shadow ? '0 2px 6px rgba(0,0,0,.7)' : 'none');
    var shows = f.shows || 'follow', v = shows === 'top' ? s.top : (s.latest || {})[shows], text;
    if (shows.indexOf('count-') === 0) {
      var k = shows.slice(6);
      text = String(f.template || '{count}').replace('{count}', (s.counts || {})[k] || 0).replace('{name}', '').replace('{amount}', '');
    } else if (!v) {
      text = f.empty || String(f.template || '{name}').replace('{name}', '—').replace('{amount}', '').replace('{count}', '');
    } else {
      text = String(f.template || '{name}').replace('{name}', v.name || '').replace('{amount}', v.display || v.amount || '').replace('{count}', '');
    }
    document.getElementById('t').textContent = text;
  }
  lightair.on('load', draw).on('fields', draw).on('session', draw);
</script>
</body></html>
