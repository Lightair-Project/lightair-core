<!doctype html>
<html><head><meta charset="utf-8"><title>Now playing</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); display: flex; align-items: center; padding: 10px; box-sizing: border-box; }
  #card { display: flex; align-items: center; gap: 14px; background: var(--bg); border-radius: 14px; padding: 10px 16px 10px 10px; max-width: 100%; transition: opacity .5s, transform .5s; }
  #card.gone { opacity: 0; transform: translateY(10px); }
  #art { width: var(--art); height: var(--art); border-radius: 10px; object-fit: cover; flex: none; background: rgba(255,255,255,.08); }
  #art.none { display: none; }
  #lines { min-width: 0; }
  #title { font-size: var(--size); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: calc(var(--size) * .72); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #label { font-size: calc(var(--size) * .5); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 800; }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="card" class="gone"><img id="art" class="none"><div id="lines"><div id="label"></div><div id="title"></div><div id="artist"></div></div></div>
<script>
  function draw() {
    var f = lightair.fields, np = (lightair.data || {}).now_playing, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 26) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.5)');
    r.setProperty('--accent', f.accentColor || '#1DB954');
    r.setProperty('--art', (f.artSize || 72) + 'px');
    document.getElementById('label').textContent = f.label || '';
    var card = document.getElementById('card');
    if (!np || !np.title) { card.className = f.hideWhenStopped ? 'gone' : ''; if (!np) document.getElementById('title').textContent = f.idle || ''; return; }
    card.className = '';
    document.getElementById('title').textContent = np.title;
    document.getElementById('artist').textContent = np.artist + (f.showAlbum && np.album ? ' · ' + np.album : '');
    var art = document.getElementById('art');
    if (f.showArt && np.artwork) { art.src = np.artwork; art.className = ''; } else { art.className = 'none'; }
  }
  lightair.on('load', draw).on('fields', draw).on('data', function (d) { if (d.key === 'now_playing') draw(); });
</script>
</body></html>
