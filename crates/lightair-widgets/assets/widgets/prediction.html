<!doctype html>
<html><head><meta charset="utf-8"><title>Prediction</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); padding: 12px; box-sizing: border-box; }
  #box { background: var(--bg); border-radius: 12px; padding: .7em .9em; }
  #q { font-weight: 800; margin-bottom: .5em; }
  .o { position: relative; margin: .3em 0; padding: .3em .6em; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar { position: absolute; inset: 0; width: 0; background: var(--accent); opacity: .45; transition: width .5s; }
  .o.won .bar { background: var(--win); opacity: .7; }
  .l { position: relative; display: flex; justify-content: space-between; gap: 1em; }
  .n { opacity: .8; font-size: .8em; }
  #foot { font-size: .7em; opacity: .8; margin-top: .4em; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="box"><div id="q"></div><div id="opts"></div><div id="foot"></div></div>
<script>
  // Viewers bet Lightair points ("!bet 1 100", "!bet 2 all"); the winners split everything bet,
  // by stake. Points are taken when a bet is placed (lightair.points) and paid or given back at
  // the end. state: open | locked | done; bets: key → {platform, id, name, outcome, stake}
  var s = { state: 'idle', until: 0, bets: {}, winner: -1, paid: 0 };
  // the outcome each viewer is betting on while their points are being taken (bets wait on that)
  var pending = {};
  function outcomes() { return String(lightair.fields.outcomes || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 4); }
  function save() { lightair.store('prediction', s); }
  function totals() {
    var t = outcomes().map(function () { return { points: 0, people: 0 }; }), all = 0;
    Object.keys(s.bets).forEach(function (k) { var b = s.bets[k]; if (t[b.outcome]) { t[b.outcome].points += b.stake; t[b.outcome].people++; all += b.stake; } });
    return { by: t, all: all };
  }
  function draw() {
    var f = lightair.fields, r = document.documentElement.style, t = totals();
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 24) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.55)');
    r.setProperty('--accent', f.accentColor || '#60A5FA');
    r.setProperty('--win', f.winColor || '#34D399');
    document.getElementById('q').textContent = f.question || '';
    document.getElementById('opts').innerHTML = outcomes().map(function (o, i) {
      var x = t.by[i], pct = t.all ? Math.round(x.points * 100 / t.all) : 0;
      var odds = x.points ? ' · 1:' + (t.all / x.points).toFixed(2) : '';
      return '<div class="o' + (s.winner === i ? ' won' : '') + '"><div class="bar" style="width:' + pct + '%"></div><div class="l"><span>' + (i + 1) + '. ' + lightair.escape(o) +
        '</span><span>' + x.points.toLocaleString() + ' <span class="n">(' + x.people + odds + ')</span></span></div></div>';
    }).join('');
    var left = Math.max(0, Math.ceil((s.until - Date.now()) / 1000)), foot;
    if (s.state === 'open') foot = 'Bet points: !bet 1 100' + (left && s.until ? ' · ' + left + ' s' : '');
    else if (s.state === 'locked') foot = 'Bets locked · ' + t.all.toLocaleString() + ' points in';
    else if (s.state === 'done') foot = s.winner >= 0 ? (outcomes()[s.winner] || '') + ' won · ' + s.paid.toLocaleString() + ' points paid' : 'Cancelled · points given back';
    else foot = 'Not started';
    document.getElementById('foot').textContent = foot;
  }
  function pay(outcome) {
    var t = totals(), win = t.by[outcome] ? t.by[outcome].points : 0;
    s.paid = 0;
    Object.keys(s.bets).forEach(function (k) {
      var b = s.bets[k], back = outcome < 0 ? b.stake : (b.outcome === outcome && win ? Math.floor(b.stake * t.all / win) : 0);
      if (back > 0) { lightair.points(b.platform, b.id, b.name, back); s.paid += back; }
    });
    // nobody won: everyone gets their points back
    if (outcome >= 0 && !win) { s.winner = outcome; return pay(-1); }
    s.state = 'done'; s.winner = outcome;
  }
  lightair.on('load', function () {
    var p = lightair.storage.prediction; if (p) s = p;
    draw();
    setInterval(function () { if (s.state === 'open' && s.until && Date.now() > s.until) { s.state = 'locked'; save(); } draw(); }, 1000);
  });
  lightair.on('fields', draw);
  lightair.on('button', function (b) {
    if (b === 'start' && s.state !== 'open' && s.state !== 'locked') {
      pending = {};
      s = { state: 'open', bets: {}, winner: -1, paid: 0, until: (+lightair.fields.seconds || 0) > 0 ? Date.now() + lightair.fields.seconds * 1000 : 0 };
    }
    if (b === 'lock' && s.state === 'open') s.state = 'locked';
    var m = /^win(\d)$/.exec(b);
    if (m && (s.state === 'open' || s.state === 'locked') && +m[1] <= outcomes().length) pay(+m[1] - 1);
    if (b === 'refund' && (s.state === 'open' || s.state === 'locked')) pay(-1);
    save(); draw();
  });
  lightair.on('event', function (e) {
    if (s.state !== 'open' || lightair.kindOf(e) !== 'message' || !e.user) return;
    var m = /^\s*!bet\s+(\d)\s+(\d+|all)\s*$/i.exec(e.text || '');
    if (!m) return;
    var f = lightair.fields, outcome = +m[1] - 1, key = e.platform + ':' + e.user.id, had = s.bets[key];
    var side = had ? had.outcome : pending[key];
    if (outcome < 0 || outcome >= outcomes().length || (side !== undefined && side !== outcome)) return;
    var name = e.user.display_name || e.user.login, max = +f.maxBet || 0, min = +f.minBet || 1;
    function place(amount) {
      if (max) amount = Math.min(amount, max - (had ? had.stake : 0));
      if (amount < min && !(had && amount > 0)) return;
      pending[key] = outcome;
      lightair.points(e.platform, e.user.id, name, -amount, function (ok) {
        if (!s.bets[key]) delete pending[key];
        var other = s.bets[key] && s.bets[key].outcome !== outcome;
        if (!ok || s.state !== 'open' || other) { if (ok) lightair.points(e.platform, e.user.id, name, amount); return; }
        var b = s.bets[key] || { platform: e.platform, id: e.user.id, name: name, outcome: outcome, stake: 0 };
        b.stake += amount; s.bets[key] = b;
        save(); draw();
      });
    }
    if (m[2].toLowerCase() === 'all') {
      // their balance: taking 0 answers with it
      lightair.points(e.platform, e.user.id, name, 0, function (ok, balance) { if (ok && balance >= 1) place(Math.floor(balance)); });
    } else place(+m[2]);
  });
</script>
</body></html>
