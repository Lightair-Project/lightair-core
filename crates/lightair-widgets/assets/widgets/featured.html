<!doctype html>
<html><head><meta charset="utf-8"><title>Featured message</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; }
  #card { background: var(--bg); border-left: .25em solid var(--accent); border-radius: 12px; padding: .55em .8em; max-width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.35);
          transform: translateY(30px); opacity: 0; transition: transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s; }
  #card.on { transform: none; opacity: 1; }
  #who { display: flex; align-items: center; gap: .35em; font-weight: 800; color: var(--name); font-size: .8em; margin-bottom: .15em; }
  #who img { height: 1em; }
  #text { line-height: 1.3; overflow-wrap: anywhere; }
</style>
<script src="/lightair.js"></script>
</head><body><div id="card"><div id="who"></div><div id="text"></div></div>
<script>
  // the message Chat › a message › Feature picked (live data "featured"; null clears it)
  var timer = null;
  function look() {
    var f = lightair.fields, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 30) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--name', f.nameColor || '#FBBF24');
    r.setProperty('--bg', f.background || 'rgba(20,20,20,0.85)');
    r.setProperty('--accent', f.accentColor || '#FF3B4A');
  }
  function show(e) {
    var card = document.getElementById('card');
    clearTimeout(timer);
    if (!e) { card.classList.remove('on'); return; }
    var f = lightair.fields, name = e.user ? (e.user.display_name || e.user.login) : '';
    document.getElementById('who').innerHTML = (f.showPlatform !== false && e.platform ? '<img src="' + lightair.icon(e.platform) + '">' : '') + lightair.escape(name);
    document.getElementById('text').innerHTML = lightair.render(e, '1.4em');
    card.classList.remove('on'); void card.offsetWidth; card.classList.add('on');
    var secs = +f.seconds || 0;
    if (secs > 0) timer = setTimeout(function () { card.classList.remove('on'); }, secs * 1000);
  }
  lightair.on('load', function () { look(); show(lightair.data.featured); });
  lightair.on('fields', look);
  lightair.on('data', function (d) { if (d.key === 'featured') show(d.value); });
  lightair.on('button', function (b) { if (b === 'clear') show(null); });
</script>
</body></html>
