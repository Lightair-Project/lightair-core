<!doctype html>
<html><head><meta charset="utf-8"><title>Event list</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); font-size: var(--size); color: var(--text); }
  #list { display: flex; flex-direction: column; gap: 6px; padding: 10px; }
  body.row #list { flex-direction: row; flex-wrap: nowrap; }
  .e { background: var(--bg); border-radius: 8px; padding: .4em .7em; display: flex; align-items: center; gap: .5em; white-space: nowrap; animation: in .4s ease-out; }
  .e img { height: 1em; width: 1em; }
  .k { font-size: .9em; }
  .n { font-weight: 700; }
  .a { color: var(--accent); font-weight: 700; }
  @keyframes in { from { opacity: 0; transform: translateY(-10px) } to { opacity: 1; transform: none } }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="list"></div>
<script>
  var ICON = { follow: '❤️', sub: '⭐', paid: '💸', cheer: '💎', raid: '🚀' };
  var list = document.getElementById('list');
  function style(f) {
    var r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 20) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--bg', f.background || 'rgba(0,0,0,0.45)');
    r.setProperty('--accent', f.accentColor || '#F5A623');
    document.body.className = f.layout === 'row' ? 'row' : '';
  }
  function add(e, old) {
    var f = lightair.fields, k = lightair.kindOf(e);
    if (!ICON[k] || !f[k + 'Show']) return;
    var el = document.createElement('div');
    el.className = 'e';
    var amount = k === 'raid' ? e.kind.viewers + ' viewers' : e.paid ? e.paid.display : (k === 'sub' && e.headline && /\d+ months?/.test(e.headline) ? /\d+ months?/.exec(e.headline)[0] : '');
    el.innerHTML = (f.showPlatform ? '<img src="' + lightair.icon(e.platform) + '">' : '') + '<span class="k">' + ICON[k] + '</span><span class="n">' + lightair.escape(e.user ? e.user.display_name : '') + '</span>' + (amount ? '<span class="a">' + lightair.escape(amount) + '</span>' : '');
    if (old) el.style.animation = 'none';
    list.insertBefore(el, list.firstChild);
    while (list.children.length > Math.max(1, +f.maxEvents || 6)) list.lastChild.remove();
  }
  lightair.on('load', function () { style(lightair.fields); lightair.recents.filter(function (e) { return !e.test; }).forEach(function (e) { add(e, true); }); });
  lightair.on('fields', style);
  lightair.on('event', function (e) { add(e, false); });
</script>
</body></html>
