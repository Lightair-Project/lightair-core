<!doctype html>
<html><head><meta charset="utf-8"><title>Goal</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-size: var(--size); display: flex; flex-direction: column; justify-content: center; padding: 0 12px; box-sizing: border-box; }
  #head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #bar { height: var(--h); background: var(--track); border-radius: calc(var(--h) / 2); overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--fill); border-radius: inherit; transition: width .8s cubic-bezier(.2,.8,.2,1); }
</style>
<script src="/lightair.js"></script>
</head><body>
<div id="head"><span id="title"></span><span id="numbers"></span></div>
<div id="bar"><div id="fill"></div></div>
<script>
  function value() {
    var f = lightair.fields, s = lightair.session || {}, n = 0;
    if (f.counts === 'paid') n = (s.totals || {})[String(f.currency || 'USD').toUpperCase()] || 0;
    else if (f.counts === 'cheer') n = (s.totals || {}).BITS || 0;
    else n = (s.counts || {})[f.counts] || 0;
    return (+f.start || 0) + n;
  }
  function draw() {
    var f = lightair.fields, r = document.documentElement.style;
    r.setProperty('--font', f.font || 'Inter, -apple-system, "Segoe UI", sans-serif');
    r.setProperty('--size', (f.fontSize || 24) + 'px');
    r.setProperty('--text', f.textColor || '#fff');
    r.setProperty('--fill', f.fillColor || '#F5A623');
    r.setProperty('--track', f.trackColor || 'rgba(0,0,0,0.45)');
    r.setProperty('--h', (f.barHeight || 28) + 'px');
    var v = value(), target = Math.max(1, +f.target || 100);
    document.getElementById('title').textContent = f.title || '';
    var shown = f.counts === 'paid' ? v.toFixed(2).replace(/\.00$/, '') : Math.round(v);
    document.getElementById('numbers').textContent = f.showNumbers ? shown + ' / ' + target : '';
    document.getElementById('fill').style.width = Math.min(100, (v / target) * 100) + '%';
  }
  lightair.on('load', draw).on('fields', draw).on('session', draw);
</script>
</body></html>
