[package]
name = "lightair-remote"
description = "Lightair's remote API: JSON-RPC and obs-websocket v5 over WebSocket, and MCP for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
httparse = "1"
sha1_smol = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tungstenite = { version = "0.30.0", default-features = false }

[dev-dependencies]
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
