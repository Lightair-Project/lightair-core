[package]
name = "lightair-remote"
description = "Lightair's remote API: JSON-RPC and obs-websocket v5 over WebSocket, and MCP for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
httparse = "1"
sha1_smol = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tungstenite = { version = "0.30.0", default-features = false }
# The TLS port for paired phones (secure.rs): rustls with ring, a self-signed ECDSA P-256 identity
# (rcgen), Ed25519 device keys (as lightair-live's rules already use), mDNS advertisement.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
time = "0.3"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
mdns-sd = { version = "0.22", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
