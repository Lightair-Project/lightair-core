[package]
name = "lightair-live"
description = "Live platforms: one event model for every platform's chat and audience events, and the readers that bring them in"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# official sign-in (oauth.rs): PKCE
sha2 = "0.10"
getrandom = "0.3"
# verifies reading rules (rules.rs); pure Rust, so the Windows build still checks from a Mac
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = "1"
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
# One TLS stack everywhere: rustls with ring (its C and assembly cross-compile with clang alone;
# aws-lc-rs would need CMake per target), certificates checked by the system's own verifier
# (rustls-platform-verifier: Security.framework, CryptoAPI, Android's), so trust settings,
# corporate roots and revocation are the system's (net.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "__rustls-tls"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
