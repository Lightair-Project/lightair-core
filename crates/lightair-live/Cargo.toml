[package]
name = "lightair-live"
description = "Live platforms: one event model for every platform's chat and audience events, and the readers that bring them in"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
flate2 = "1"
tracing.workspace = true
parking_lot.workspace = true
# the system's own TLS (Security.framework, SChannel): no C to build, so the Windows build checks
# from a Mac
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip"] }
